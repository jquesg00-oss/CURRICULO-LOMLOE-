<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#102a43">
<title>Entrenador Currículo EF · Asturias</title>
<style>
:root{--nav:#102a43;--blue:#1769aa;--bg:#f4f7fb;--card:#fff;--ok:#18794e;--bad:#c62828;--muted:#607080}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#152536}
header{background:var(--nav);color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:4}
header h1{font-size:20px;margin:0 0 5px}header p{margin:0;font-size:13px;opacity:.85}
.wrap{max-width:820px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:white;border-radius:14px;padding:10px;text-align:center;box-shadow:0 2px 8px #00000010}.stat b{display:block;font-size:20px}
.card{background:white;border-radius:18px;padding:18px;box-shadow:0 3px 14px #00000012}.tag{font-size:12px;color:var(--blue);font-weight:700}
h2{font-size:19px;line-height:1.3;margin:8px 0 16px}.opt{width:100%;text-align:left;border:1.5px solid #d8e1eb;background:white;padding:14px;margin:7px 0;border-radius:13px;font-size:16px;line-height:1.25}
.opt:active{transform:scale(.995)}.opt.selected{border-color:var(--blue);background:#eaf4ff}.opt.correct{border-color:var(--ok);background:#eaf8f1}.opt.wrong{border-color:var(--bad);background:#fff0f0}
.actions{display:flex;gap:9px;margin-top:16px}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:700;font-size:15px;flex:1}.primary{background:var(--blue);color:white}.secondary{background:#e8eef5;color:#19324a}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:12px;line-height:1.35}.feedback.ok{display:block;background:#eaf8f1;color:#145a3a}.feedback.bad{display:block;background:#fff0f0;color:#8b1d1d}
.progress{height:7px;background:#dce5ef;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:#52a5e8;width:0}
.result{text-align:center}.score{font-size:56px;font-weight:800;color:var(--nav);margin:12px}.review{margin-top:14px;text-align:left}.review div{background:#f8fafc;padding:12px;border-radius:10px;margin:8px 0}
.hidden{display:none}.switch{display:flex;gap:8px;margin-bottom:12px}.switch button{padding:9px 11px;border:0;border-radius:10px;background:#e6edf5}.switch .on{background:#193f63;color:white}
small{color:var(--muted)} footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
</style></head>
<body>
<header><h1>🏃 Entrenador de Currículo EF</h1><p>D.59/2022 ESO · D.60/2022 Bachillerato · Asturias</p><div class="progress"><div class="bar" id="bar"></div></div></header>
<div class="wrap">
<div class="switch"><button id="normal" class="on">40 preguntas</button><button id="errors">Solo falladas</button></div>
<div class="stats"><div class="stat"><small>Pregunta</small><b id="num">1/40</b></div><div class="stat"><small>Aciertos</small><b id="hits">0</b></div><div class="stat"><small>Racha</small><b id="streak">0</b></div></div>
<div class="card" id="quiz"><span class="tag" id="tag">NIVEL OPOSICIÓN</span><h2 id="question"></h2><div id="options"></div>
<div class="feedback" id="feedback"></div><div class="actions"><button class="btn secondary" id="check">Corregir</button><button class="btn primary" id="next" disabled>Siguiente →</button></div></div>
<div class="card result hidden" id="result"><div>RESULTADO</div><div class="score" id="score"></div><h2 id="level"></h2><p id="summary"></p><div class="actions"><button class="btn secondary" id="retryErrors">Repetir falladas</button><button class="btn primary" id="restart">Nuevo intento</button></div><div class="review" id="review"></div></div>
<footer>Funciona sin conexión una vez guardado el archivo · Tus resultados se guardan solo en este dispositivo.</footer>
</div>
<script>
const bank=[{"q": "En 3.º-4.º ESO, un alumno planifica su práctica física según sus necesidades e intereses y la autorregula. ¿Qué criterio se ajusta de forma MÁS directa?", "o": ["1.1", "1.2", "2.1", "2.3"], "a": 0, "e": "El 1.1 pasa de establecer y organizar secuencias sencillas en 1.º-2.º a planificar y autorregular la práctica en 3.º-4.º."}, {"q": "¿Qué diferencia separa mejor el criterio 1.3 del 1.4 en ESO?", "o": ["1.3 = dosificación; 1.4 = higiene", "1.3 = prevención de lesiones; 1.4 = actuación ante accidentes y primeros auxilios", "1.3 = primeros auxilios; 1.4 = prevención", "No existe diferencia relevante"], "a": 1, "e": "1.3 se centra en prevención de lesiones y reconocimiento del riesgo; 1.4 en protocolos de intervención y primeros auxilios."}, {"q": "En 4.º ESO, contrastar información sobre prácticas de salud mediante criterios científicos de validez, fiabilidad y objetividad corresponde principalmente a:", "o": ["1.2", "1.5", "1.6", "4.2"], "a": 1, "e": "El 1.5 de 3.º-4.º incorpora expresamente el contraste autónomo de información con criterios científicos."}, {"q": "¿Qué cambio aparece en el 1.6 al pasar de 1.º-2.º a 3.º-4.º ESO?", "o": ["Se elimina lo digital", "De explorar recursos y riesgos se pasa a planificar, desarrollar y compartir práctica física con seguridad usando recursos digitales", "Se limita a privacidad", "Pasa a primeros auxilios"], "a": 1, "e": "La progresión va de explorar recursos y reconocer riesgos a utilizarlos con seguridad para planificar, desarrollar y compartir práctica."}, {"q": "Un proyecto motor incluye mecanismos de autoevaluación y coevaluación del proceso y del resultado. ¿Qué criterio de la CE2 es el más directo?", "o": ["2.1", "2.2", "2.3", "3.2"], "a": 0, "e": "2.1 se vincula a proyectos motores e incorpora mecanismos de autoevaluación y coevaluación."}, {"q": "En un 3x3 de balonmano, el alumnado debe anticiparse, decidir y adaptar su respuesta a compañeros y oponentes. ¿Qué criterio es el más específico?", "o": ["2.1", "2.2", "2.3", "3.1"], "a": 1, "e": "2.2 se centra en interpretar y actuar en contextos motores, tomar decisiones y adaptarse a la incertidumbre."}, {"q": "En una tarea técnica se valora control corporal, eficacia y creatividad para resolver un problema motor transferible. ¿Qué criterio?", "o": ["1.2", "2.2", "2.3", "3.3"], "a": 2, "e": "2.3 se refiere al control y dominio corporal mediante los componentes cualitativos y cuantitativos de la motricidad."}, {"q": "¿Qué conjunto corresponde a los descriptores de la CE2 de ESO?", "o": ["CPSAA4 · CPSAA5 · CE2 · CE3", "CCL5 · CPSAA1 · CPSAA3 · CPSAA5 · CC3", "STEM5 · CC4 · CE1 · CE3", "CC2 · CC3 · CCEC1 · CCEC2 · CCEC3 · CCEC4"], "a": 0, "e": "La CE2 de ESO conecta con CPSAA4, CPSAA5, CE2 y CE3."}, {"q": "¿Cuál es la diferencia más precisa entre 3.1 y 3.2 en 3.º-4.º ESO?", "o": ["3.1: deportividad y responsabilidades organizativas; 3.2: cooperación, roles, gestión del tiempo y resultado", "3.1: cooperación; 3.2: primeros auxilios", "3.1: salud; 3.2: deporte", "Son intercambiables"], "a": 0, "e": "3.1 enfatiza participación responsable y deportividad; 3.2 cooperación y organización interna de producciones/proyectos."}, {"q": "Una rúbrica valora diálogo, resolución de conflictos, respeto a la diversidad y oposición activa a la discriminación. ¿Qué criterio?", "o": ["3.1", "3.2", "3.3", "4.2"], "a": 2, "e": "3.3 concentra habilidades sociales, diálogo, diversidad y rechazo de estereotipos, discriminación y violencia."}, {"q": "¿Qué descriptores se asocian a la CE3 en ESO?", "o": ["STEM5 · CC4 · CE1 · CE3", "CCL5 · CPSAA1 · CPSAA3 · CPSAA5 · CC3", "CPSAA4 · CPSAA5 · CE2 · CE3", "CCL3 · STEM2 · STEM5 · CD4"], "a": 1, "e": "CE3 ESO: CCL5, CPSAA1, CPSAA3, CPSAA5 y CC3."}, {"q": "Analizar objetivamente una modalidad deportiva evitando estereotipos de género o capacidad se relaciona principalmente con:", "o": ["3.3", "4.1", "4.2", "4.3"], "a": 2, "e": "4.2 aborda el análisis de actividades/deportes y los estereotipos de género, capacidad y sexismo."}, {"q": "Crear y representar una composición corporal con base musical en ESO corresponde principalmente a:", "o": ["3.2", "4.1", "4.2", "4.3"], "a": 3, "e": "La creación y representación corporal se ubica en el 4.3 de ESO."}, {"q": "¿Qué conjunto corresponde a los descriptores de la CE4 de ESO?", "o": ["CC2 · CC3 · CCEC1 · CCEC2 · CCEC3 · CCEC4", "STEM5 · CPSAA1.2 · CC1 · CCEC1", "CCL5 · CPSAA1 · CPSAA3 · CPSAA5 · CC3", "STEM5 · CC4 · CE1 · CE3"], "a": 0, "e": "La CE4 de ESO conecta con CC2, CC3, CCEC1, CCEC2, CCEC3 y CCEC4."}, {"q": "¿Qué diferencia esencial existe entre 5.1 y 5.2 en 3.º-4.º ESO?", "o": ["5.1 = sostenibilidad/conservación; 5.2 = diseño-organización y seguridad", "5.1 = seguridad; 5.2 = expresión", "5.1 = cooperación; 5.2 = salud", "Ninguna"], "a": 0, "e": "5.1 enfatiza huella ecológica y conservación/mejora; 5.2 diseño, organización, responsabilidades y seguridad."}, {"q": "¿Cuál es la progresión correcta del 5.2 de ESO?", "o": ["De diseñar a simplemente participar", "De practicar aplicando seguridad a diseñar y organizar asumiendo responsabilidades", "No cambia", "De medio natural a gimnasio"], "a": 1, "e": "En 1.º-2.º se practica aplicando seguridad; en 3.º-4.º se diseña y organiza asumiendo responsabilidades."}, {"q": "¿Qué descriptores corresponden a la CE5 de ESO?", "o": ["STEM5 · CC4 · CE1 · CE3", "CPSAA4 · CPSAA5 · CE2 · CE3", "CCL3 · STEM2 · STEM5 · CD4 · CPSAA2 · CPSAA4", "STEM5 · CPSAA1.2 · CPSAA2 · CC4 · CE1"], "a": 0, "e": "CE5 ESO: STEM5, CC4, CE1 y CE3."}, {"q": "¿Qué afirmación sobre los seis bloques de saberes es más correcta?", "o": ["Cada situación debe centrarse en un único bloque", "Son compartimentos estancos", "Deben movilizarse de forma integrada y transversal en situaciones variadas", "Solo sirven para contenidos teóricos"], "a": 2, "e": "El currículo plantea integrar saberes de forma transversal, evitando propuestas centradas exclusivamente en un único bloque."}, {"q": "¿Qué asociación bloque-contenido es INCORRECTA?", "o": ["A → salud física, social y mental", "C → toma de decisiones y creatividad motriz", "D → patrimonio, danzas y expresión corporal", "F → entorno natural/urbano, riesgo y sostenibilidad"], "a": 2, "e": "Patrimonio, danzas y expresión corporal corresponden al bloque E; D se centra en autorregulación emocional e interacción social."}, {"q": "¿En qué bloque encajan principalmente PAS, 112, SVB, planificación de proyectos y seguridad?", "o": ["A", "B", "C", "F"], "a": 1, "e": "El bloque B reúne organización y gestión de la actividad física, incluyendo proyectos, seguridad y actuación ante accidentes."}, {"q": "¿En qué bloque se sitúan especialmente toma de decisiones, adaptación técnico-táctica y creatividad motriz?", "o": ["A", "B", "C", "E"], "a": 2, "e": "Son elementos nucleares del bloque C: resolución de problemas en situaciones motrices."}, {"q": "¿Qué saber representa mejor la evolución del bloque E en 3.º-4.º ESO?", "o": ["Solo calentamiento", "Historia del deporte con perspectiva de género e intereses políticos/económicos", "PAS y SVB", "Frecuencia cardiaca"], "a": 1, "e": "En 3.º-4.º se profundiza en la dimensión cultural/social del deporte, perspectiva de género e intereses políticos/económicos."}, {"q": "En Bachillerato, ¿qué criterio exige elaborar, aplicar y evaluar un programa personal de actividad física?", "o": ["1.1", "1.2", "2.1", "3.1"], "a": 0, "e": "El 1.1 de Bachillerato se centra en el programa personal de actividad física y su evaluación."}, {"q": "En Bachillerato, incorporar activación, autorregulación del esfuerzo, alimentación, postura, relajación e higiene y relacionarlo con estudios/profesiones corresponde a:", "o": ["1.1", "1.2", "1.3", "3.1"], "a": 1, "e": "El 1.2 incorpora esos hábitos y añade reflexión sobre su relación con futuros estudios o desempeños profesionales."}, {"q": "¿Qué peculiaridad tiene el criterio 1.3 de Bachillerato respecto a ESO?", "o": ["Solo trata prevención", "Integra prevención de lesiones y primeros auxilios, con transferencia a contextos profesionales/ocupacionales", "Solo trata apps", "Es expresión corporal"], "a": 1, "e": "En Bachillerato el 1.3 integra prevención y primeros auxilios y busca transferencia a contextos profesionales/ocupacionales."}, {"q": "En Bachillerato, analizar críticamente estereotipos corporales y conductas de riesgo utilizando criterios científicos corresponde a:", "o": ["1.2", "1.3", "1.4", "1.5"], "a": 2, "e": "El 1.4 recoge la postura crítica y comprometida y el contraste con criterios científicos."}, {"q": "En Bachillerato, el uso autónomo de apps y dispositivos gestionando privacidad y seguridad corresponde a:", "o": ["1.4", "1.5", "2.1", "5.2"], "a": 1, "e": "El 1.5 se ocupa específicamente de aplicaciones/dispositivos, privacidad y seguridad."}, {"q": "¿Qué conjunto corresponde a la CE1 de Bachillerato?", "o": ["STEM2 · STEM5 · CD1 · CD4 · CPSAA1.1 · CPSAA1.2 · CPSAA5 · CE3", "CCL3 · STEM2 · STEM5 · CD4 · CPSAA2 · CPSAA4", "CPSAA1.2 · CPSAA4 · CE2 · CE3", "STEM5 · CPSAA1.2 · CC1 · CCEC1"], "a": 0, "e": "CE1 Bachillerato conecta con STEM2, STEM5, CD1, CD4, CPSAA1.1, CPSAA1.2, CPSAA5 y CE3."}, {"q": "Un grupo de Bachillerato desarrolla un proyecto motor y resuelve autónomamente un imprevisto de forma eficiente y creativa. ¿Qué criterio?", "o": ["2.1", "2.2", "2.3", "3.2"], "a": 0, "e": "2.1 de Bachillerato se centra en proyectos motores y gestión autónoma de imprevistos."}, {"q": "Resolver con fluidez una situación de oposición-colaboración adaptando estrategias y automatizando percepción-decisión-ejecución corresponde a:", "o": ["2.1", "2.2", "2.3", "3.1"], "a": 1, "e": "El 2.2 se centra en resolver situaciones deportivas/recreativas y adaptar estrategias con automatización perceptivo-decisional."}, {"q": "Analizar un gesto técnico, identificar factores cualitativos/cuantitativos, detectar errores y proponer soluciones corresponde a:", "o": ["1.1", "2.1", "2.2", "2.3"], "a": 3, "e": "El 2.3 de Bachillerato exige analizar factores de la motricidad, errores comunes y soluciones."}, {"q": "¿Qué diferencia separa mejor el 2.2 del 2.3 de Bachillerato?", "o": ["2.2 resuelve situaciones; 2.3 analiza factores del gesto y propone soluciones", "2.2 es salud; 2.3 convivencia", "2.2 es cooperación; 2.3 expresión", "Ninguna"], "a": 0, "e": "2.2 es desempeño resolutivo; 2.3 es análisis técnico-motor de factores, errores y soluciones."}, {"q": "En Bachillerato, organizar y practicar actividades, asumir roles y valorar posibles salidas profesionales se asocia principalmente a:", "o": ["2.1", "3.1", "3.2", "4.1"], "a": 1, "e": "El 3.1 incluye organización/práctica, roles, liderazgo y consideración de posibles salidas profesionales."}, {"q": "Cooperar con iniciativa en un proyecto de Bachillerato y resolver imprevistos coordinadamente corresponde a:", "o": ["2.1 exclusivamente", "3.1", "3.2", "3.3"], "a": 2, "e": "El 3.2 pone el foco en cooperación/colaboración con iniciativa y resolución coordinada de imprevistos."}, {"q": "¿Qué descriptores corresponden a la CE3 de Bachillerato?", "o": ["CCL5 · CPSAA1.1 · CPSAA2 · CPSAA5 · CC3", "CCL5 · CPSAA1 · CPSAA3 · CPSAA5 · CC3", "STEM5 · CPSAA1.2 · CC1 · CCEC1", "STEM5 · CPSAA1.2 · CPSAA2 · CC4 · CE1"], "a": 0, "e": "En Bachillerato CE3: CCL5, CPSAA1.1, CPSAA2, CPSAA5 y CC3."}, {"q": "¿Qué cambio de numeración puede inducir a error al pasar de ESO a Bachillerato en expresión corporal?", "o": ["En ESO es 4.3 y en Bachillerato la creación/representación aparece en 4.2", "En ambos es 4.3", "En Bachillerato pasa a 3.3", "En ESO es 4.1"], "a": 0, "e": "ESO utiliza 4.3 para creación/representación; Bachillerato tiene dos criterios en CE4 y la creación escénica es 4.2."}, {"q": "¿Qué descriptores corresponden a la CE4 de Bachillerato?", "o": ["STEM5 · CPSAA1.2 · CC1 · CCEC1", "CC2 · CC3 · CCEC1 · CCEC2 · CCEC3 · CCEC4", "CPSAA1.2 · CPSAA4 · CE2 · CE3", "STEM5 · CC4 · CE1 · CE3"], "a": 0, "e": "CE4 Bachillerato: STEM5, CPSAA1.2, CC1 y CCEC1."}, {"q": "En Bachillerato, promover una actividad sostenible que incluya acciones de conservación y mejora del espacio corresponde especialmente a:", "o": ["4.1", "5.1", "5.2", "3.1"], "a": 1, "e": "5.1 se centra en promover/participar sosteniblemente y realizar acciones de conservación y mejora."}, {"q": "Organizar para otras personas una actividad en medio natural controlando riesgos del material, entorno y participantes corresponde a Bachillerato:", "o": ["1.3", "3.2", "5.1", "5.2"], "a": 3, "e": "5.2 incluye práctica y organización, responsabilidades y control del riesgo."}, {"q": "Caso de oposición: una SA de orientación en 4.º ESO evalúa decisiones en incertidumbre, cooperación autónoma y organización segura en el entorno. ¿Qué combinación es MÁS coherente?", "o": ["2.2 + 3.2 + 5.2", "1.4 + 4.3 + 5.1", "1.2 + 3.1 + 4.2", "Solo 5.2"], "a": 0, "e": "Integra resolución motriz (2.2), cooperación/roles (3.2) y diseño-organización segura en el entorno (5.2)."}];
let order=[],pos=0,selected=null,hits=0,streak=0,wrong=[],answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indices=null){order=indices?shuffle([...indices]):shuffle(bank.map((_,i)=>i));pos=0;hits=0;streak=0;wrong=[];$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){selected=null;answered=false;$("feedback").className="feedback";$("feedback").innerHTML="";$("next").disabled=true;$("check").disabled=false;
let q=bank[order[pos]];$("question").textContent=q.q;$("num").textContent=(pos+1)+"/"+order.length;$("hits").textContent=hits;$("streak").textContent=streak;$("bar").style.width=((pos)/order.length*100)+"%";
let opts=q.o.map((txt,i)=>({txt,i}));shuffle(opts);$("options").innerHTML="";
opts.forEach(x=>{let b=document.createElement("button");b.className="opt";b.textContent=x.txt;b.dataset.i=x.i;b.onclick=()=>{if(answered)return;document.querySelectorAll(".opt").forEach(z=>z.classList.remove("selected"));b.classList.add("selected");selected=x.i};$("options").appendChild(b)})}
$("check").onclick=()=>{if(selected===null)return;answered=true;let q=bank[order[pos]],ok=selected===q.a;document.querySelectorAll(".opt").forEach(b=>{let i=+b.dataset.i;if(i===q.a)b.classList.add("correct");else if(i===selected)b.classList.add("wrong")});
if(ok){hits++;streak++;$("feedback").className="feedback ok";$("feedback").innerHTML="<b>✅ Correcta.</b> "+q.e}else{streak=0;wrong.push(order[pos]);$("feedback").className="feedback bad";$("feedback").innerHTML="<b>❌ Incorrecta.</b> "+q.e}
$("hits").textContent=hits;$("streak").textContent=streak;$("check").disabled=true;$("next").disabled=false};
$("next").onclick=()=>{pos++;if(pos>=order.length)finish();else render()};
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("bar").style.width="100%";let pct=Math.round(hits/order.length*100),note=(hits/order.length*10).toFixed(1);$("score").textContent=note+"/10";$("level").textContent=note>=9?"🔥 Dominio muy alto":note>=8.5?"🎯 Nivel oposición":note>=7?"💪 Buen nivel":note>=5?"⚠️ Aprobado: repasa matices":"📚 Necesitas repaso";
$("summary").textContent=`${hits} aciertos de ${order.length} · ${wrong.length} fallos · ${pct}%`;localStorage.setItem("efWrong",JSON.stringify(wrong));
$("review").innerHTML=wrong.length?"<h3>Fallos a repasar</h3>"+wrong.map(i=>`<div><b>${bank[i].q}</b><br><small>${bank[i].e}</small></div>`).join(""):"<div>🏆 Sin fallos. Muy buen dominio.</div>";}
$("restart").onclick=()=>start();$("retryErrors").onclick=()=>{let w=wrong.length?wrong:JSON.parse(localStorage.getItem("efWrong")||"[]");if(w.length)start(w)};
$("normal").onclick=()=>{$("normal").classList.add("on");$("errors").classList.remove("on");start()};
$("errors").onclick=()=>{let w=JSON.parse(localStorage.getItem("efWrong")||"[]");if(w.length){$("errors").classList.add("on");$("normal").classList.remove("on");start(w)}else alert("Todavía no tienes preguntas falladas guardadas.")};
start();
</script></body></html>
